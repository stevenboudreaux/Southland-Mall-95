<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,900&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
		<title>Houma Mall Rewind - Godot Mall</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}
/* Load screen: the 2D game's arch-and-sunburst title logo, redrawn for "Houma Mall Rewind" in a
   1990s radio-banner palette (black, raspberry, gold). The logo is the decorative #load-logo
   (inline SVG) because the wing-crossing code overwrites #load-title with "Wing 1"/"Wing 2". */
:root {
	--lr-black: #000000;
	--lr-mag: #B42D53;
	--lr-gold: #ECC144;
	--lr-speck: #1F1906;
	--lr-white: #ffffff;
	--lr-dim: #9b9488;
	--lr-logo: 'Kanit', 'Arial Black', 'Futura', Impact, sans-serif;
	--lr-logo-style: italic;
	--lr-logo-weight: 900;
	--lr-logo-skew: -4deg;
	--lr-logo-track: -0.02em;
	--lr-serif: 'Tinos', 'Times New Roman', Times, serif;
}
#status { background: var(--lr-black); color: var(--lr-white); font-family: var(--lr-serif); }
#load-card {
	position: absolute; inset: 0; box-sizing: border-box;
	display: flex; flex-direction: column; align-items: center; text-align: center;
	padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
	container-type: size;
}
/* column, top to bottom: bubble area, logo, a smaller spacer, tip + bar.
   The bubble area never shrinks below one bubble, so the logo doesn't jump when facts change. */
#load-head { flex: none; width: 100%; display: flex; flex-direction: column; align-items: center; }
#load-gap { flex: 0.6 1 0; min-height: 6px; }
#load-sub { display: none; }
#load-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; }

/* the logo: as wide as the card allows, but leave room above it for a bubble (1.227 = SVG width / height) */
#load-logo {
	position: relative; flex: none; user-select: none; pointer-events: none;
	width: min(100%, 760px, calc((100vh - 350px) * 1.227));
	width: min(100%, 760px, calc((100cqh - 318px) * 1.227));
	animation: lr-shake 0.3s 1.42s linear both;
}
#load-logo svg { display: block; width: 100%; height: auto; overflow: visible; }
.lr-g { stroke: url(#lr-goldpaint); fill: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; }
/* arch strokes draw on, from the bottom centre round to the top */
.lr-arch { stroke-dasharray: 1; stroke-dashoffset: 1; animation: lr-draw 0.75s 0.05s cubic-bezier(.5, 0, .3, 1) both; }
/* one seamless copy takes over when the two halves meet (no hairline at the joins) */
.lr-arch-full { animation: lr-on 0.01s 0.8s step-end both; }
@keyframes lr-on { from { opacity: 0; } to { opacity: 1; } }
/* fan rays shoot out one after another, left to right, from the fan's point */
.lr-ray { fill: var(--lr-mag); transform-box: view-box; transform-origin: 270px 236px; animation: lr-ray 0.34s cubic-bezier(.2, .9, .3, 1.35) both; }
.lr-ray:nth-child(1) { animation-delay: 0.50s; } .lr-ray:nth-child(2) { animation-delay: 0.57s; }
.lr-ray:nth-child(3) { animation-delay: 0.64s; } .lr-ray:nth-child(4) { animation-delay: 0.71s; }
.lr-ray:nth-child(5) { animation-delay: 0.78s; } .lr-ray:nth-child(6) { animation-delay: 0.85s; }
.lr-ray:nth-child(7) { animation-delay: 0.92s; }
/* big H and A slam in, OUM pops, the rules draw out, then M-A-L-L drop in */
.lr-big, .lr-oum, .lr-rule, .lr-mall { transform-box: fill-box; transform-origin: 50% 50%; }
.lr-big { animation: lr-slam 0.32s 1.18s cubic-bezier(.5, 0, .7, 1.2) both; }
.lr-big.lr-a2 { animation-delay: 1.26s; }
.lr-oum { animation: lr-popin 0.3s 1.34s cubic-bezier(.2, .9, .3, 1.4) both; }
.lr-rule { animation: lr-rule 0.26s 1.42s ease-out both; }
.lr-mall { animation: lr-drop 0.32s cubic-bezier(.3, 1.5, .5, 1) both; }
.lr-mall.m1 { animation-delay: 1.52s; } .lr-mall.m2 { animation-delay: 1.60s; }
.lr-mall.m3 { animation-delay: 1.68s; } .lr-mall.m4 { animation-delay: 1.76s; }
/* the Rewind badge: an HTML box over the SVG (left/top/width are viewBox 352,18 and 164 wide out of 540x440) */
.lr-stamp { position: absolute; left: 65.19%; top: 4.09%; width: 30.37%; animation: lr-stamp 0.5s 1.72s cubic-bezier(.2, .8, .3, 1.2) both; }
.lr-stamp-g { position: relative; animation: lr-glitch 0.36s 2.12s both; }
.lr-stamp-g::after { content: ''; position: absolute; inset: 0; opacity: 0; pointer-events: none;
	background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.55) 0 2px, transparent 2px 5px);
	animation: lr-scan 0.36s 2.12s steps(1) both; }
/* a VHS tracking band rolls down the whole logo while the badge glitches */
.lr-band { position: absolute; left: -2%; right: -2%; top: 0; height: 9%; opacity: 0; pointer-events: none;
	background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.22) 45%, rgba(236, 193, 68, 0.3) 55%, transparent);
	animation: lr-band 0.42s 2.06s linear both; }
@keyframes lr-draw { to { stroke-dashoffset: 0; } }
@keyframes lr-ray { 0% { transform: scale(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes lr-slam { 0% { transform: scale(2.8); opacity: 0; } 60% { opacity: 1; } 75% { transform: scale(0.92); } 100% { transform: scale(1); opacity: 1; } }
@keyframes lr-popin { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes lr-rule { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
@keyframes lr-drop { 0% { transform: translateY(-60px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
@keyframes lr-shake { 0%, 100% { transform: none; } 20% { transform: translate(-4px, 3px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(1px, 0); } }
@keyframes lr-stamp { 0% { transform: rotate(-420deg) scale(0); opacity: 0; } 55% { opacity: 1; } 70% { transform: rotate(12deg) scale(1.18); } 85% { transform: rotate(-3deg) scale(0.96); } 100% { transform: rotate(0) scale(1); opacity: 1; } }
@keyframes lr-glitch {
	0% { transform: none; filter: none; animation-timing-function: steps(1); }
	12% { transform: translate(-7px, 0) skewX(-10deg); filter: drop-shadow(-5px 0 0 #00e5ff) drop-shadow(5px 0 0 #ff2a6d); animation-timing-function: steps(1); }
	28% { transform: translate(6px, 2px); filter: drop-shadow(4px 0 0 #00e5ff) drop-shadow(-4px 0 0 #ff2a6d); animation-timing-function: steps(1); }
	44% { transform: translate(-3px, -1px) skewX(6deg); filter: drop-shadow(-3px 0 0 #00e5ff) drop-shadow(3px 0 0 #ff2a6d); animation-timing-function: steps(1); }
	62% { transform: translate(2px, 0); filter: drop-shadow(2px 0 0 #00e5ff) drop-shadow(-2px 0 0 #ff2a6d); animation-timing-function: steps(1); }
	80%, 100% { transform: none; filter: none; }
}
@keyframes lr-scan { 0% { opacity: 0.9; } 50% { opacity: 0.5; } 80%, 100% { opacity: 0; } }
@keyframes lr-band { 0% { top: -10%; opacity: 0; } 8% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

/* fact stage: every bubble sits in the same grid cell so old and new overlap while swapping */
#load-fact {
	flex: 1 1 0; min-height: 252px; width: 100%; max-width: 620px;
	display: grid; place-items: end center; padding: 4px 0 2px; box-sizing: border-box;
	--jx: min(1.6vw, 36px); --jy: 8px;
}
.lr-pop {
	grid-area: 1 / 1; position: relative; box-sizing: border-box;
	width: min(100% - 28px, 580px); margin-bottom: 34px;
	transform: translate(calc(var(--dx, 0) * var(--jx)), calc(var(--dy, 0) * var(--jy))) rotate(var(--rot, 0deg));
	transform-origin: var(--ox, 22%) 115%;
	filter: drop-shadow(5px 6px 0 var(--lr-mag));
	animation: lr-pop-in 0.42s cubic-bezier(.2, .9, .3, 1.25) both;
	will-change: transform, opacity;
}
.lr-pop.out { animation: lr-pop-out 0.24s ease-in both; }
.lr-body {
	position: relative; background: #fff; color: #111; text-align: left;
	border-radius: 30px / 26px; padding: 16px 20px 16px 22px;
}
.lr-badge {
	position: absolute; left: -8px; top: -14px; width: 42px; height: 42px; border-radius: 50%;
	background: var(--lr-gold); box-shadow: 0 0 0 3px #000; display: grid; place-items: center;
	animation: lr-badge 0.5s 0.12s cubic-bezier(.2, .9, .3, 1.4) both;
}
.lr-badge svg { width: 24px; height: 24px; fill: #000; }
.lr-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding-left: 26px; margin-bottom: 6px; }
.lr-kick { font: 700 11px/1.2 var(--lr-serif); letter-spacing: 0.16em; text-transform: uppercase; color: #6a6258; }
.lr-store { font-family: var(--lr-logo); font-style: var(--lr-logo-style); font-weight: var(--lr-logo-weight); font-size: clamp(17px, 0.8vw + 13px, 22px); line-height: 1.05; color: var(--lr-mag); letter-spacing: var(--lr-logo-track); }
.lr-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; }
.lr-stat {
	flex: none; font-family: var(--lr-logo); font-style: var(--lr-logo-style); font-weight: var(--lr-logo-weight);
	font-size: clamp(34px, 2.6vw + 22px, 56px); line-height: 1; color: var(--lr-mag); letter-spacing: -0.02em;
	transform: skewX(var(--lr-logo-skew)); padding-right: 0.06em;
}
.lr-text { flex: 1 1 200px; margin: 0; font: 700 clamp(16.5px, 0.3vw + 15px, 19.5px)/1.34 var(--lr-serif); color: #111; }
/* thought-bubble tail: two white dots trailing off a lower corner */
.lr-tail { position: absolute; background: #fff; border-radius: 50%; animation: lr-dot 0.3s cubic-bezier(.2, .9, .3, 1.5) both; }
.lr-tail.t1 { width: 22px; height: 18px; bottom: -22px; left: var(--tx1, 16%); animation-delay: 0.1s; }
.lr-tail.t2 { width: 12px; height: 10px; bottom: -36px; left: var(--tx2, 11%); animation-delay: 0.18s; }
/* the "bloop": a gold ring that bursts out of the tail as the bubble lands */
.lr-pop::after {
	content: ''; position: absolute; left: var(--tx2, 11%); bottom: -40px; width: 14px; height: 14px; margin: -2px 0 0 -2px;
	border: 3px solid var(--lr-gold); border-radius: 50%; opacity: 0; pointer-events: none;
	animation: lr-bloop 0.55s 0.16s ease-out both;
}
.lr-pop.out::after { animation: none; }
@keyframes lr-pop-in {
	0% { opacity: 0; transform: translate(calc(var(--dx, 0) * var(--jx)), calc(var(--dy, 0) * var(--jy))) rotate(calc(var(--rot, 0deg) - 7deg)) scale(0.25); }
	55% { opacity: 1; transform: translate(calc(var(--dx, 0) * var(--jx)), calc(var(--dy, 0) * var(--jy))) rotate(calc(var(--rot, 0deg) + 1.5deg)) scale(1.07); }
	78% { transform: translate(calc(var(--dx, 0) * var(--jx)), calc(var(--dy, 0) * var(--jy))) rotate(var(--rot, 0deg)) scale(0.97); }
	100% { opacity: 1; transform: translate(calc(var(--dx, 0) * var(--jx)), calc(var(--dy, 0) * var(--jy))) rotate(var(--rot, 0deg)) scale(1); }
}
@keyframes lr-pop-out {
	0% { opacity: 1; transform: translate(calc(var(--dx, 0) * var(--jx)), calc(var(--dy, 0) * var(--jy))) rotate(var(--rot, 0deg)) scale(1); }
	35% { opacity: 1; transform: translate(calc(var(--dx, 0) * var(--jx)), calc(var(--dy, 0) * var(--jy))) rotate(var(--rot, 0deg)) scale(1.06); }
	100% { opacity: 0; transform: translate(calc(var(--dx, 0) * var(--jx)), calc(var(--dy, 0) * var(--jy))) rotate(calc(var(--rot, 0deg) + 4deg)) scale(0.2); }
}
@keyframes lr-badge { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes lr-dot { 0% { transform: scale(0); } 100% { transform: scale(1); } }
@keyframes lr-bloop { 0% { opacity: 1; transform: scale(0.4); } 100% { opacity: 0; transform: scale(3.4); } }

/* bottom strip: controls tip, then a small recessed bar, then #load-mb (errors only) */
#load-foot { flex: none; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 9px; }
#load-tip { font: 400 12px/1.45 var(--lr-serif); color: var(--lr-dim); max-width: 34em; }
#load-tip b { color: #cfc8bb; }
#load-tip .tip-touch, #load-tip .tip-keys { display: block; }
@media (hover: hover) and (pointer: fine) { #load-tip .tip-touch { display: none; } }
@media (pointer: coarse) { #load-tip .tip-keys { display: none; } }
#load-track {
	width: min(300px, 58vw); height: 5px; border-radius: 3px; overflow: hidden;
	background: #111; box-shadow: inset 0 1px 2px #000, inset 0 0 0 1px #1c1c1c, 0 1px 0 rgba(255, 255, 255, 0.07);
}
#load-bar { height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, var(--lr-mag), var(--lr-gold)); transition: width 0.25s; }
#load-mb { font: 700 12px/1.35 var(--lr-serif); color: var(--lr-gold); max-width: min(34em, 92vw); }
#load-mb:empty { display: none; }

/* crossing between the wings: same look, tighter */
body.xfer #load-tip { display: none; }
/* smaller logo, one quick 0.6 s entrance instead of the full sequence */
body.xfer #load-logo { width: min(66%, 300px, calc((100vh - 420px) * 1.227)); width: min(66%, 300px, calc((100cqh - 400px) * 1.227)); animation: lr-quick 0.6s cubic-bezier(.2, .9, .3, 1.2) both; }
body.xfer #load-logo *, body.xfer #load-logo *::after { animation: none !important; }
body.xfer .lr-band { display: none; }
body.xfer .lr-arch { stroke-dashoffset: 0; }
body.xfer #load-title {
	position: static; width: auto; height: auto; overflow: visible; clip: auto; margin: 0.45em 0 0; white-space: normal;
	font: 700 clamp(26px, 2vw + 18px, 40px)/1.05 var(--lr-serif); color: var(--lr-white);
}
@keyframes lr-quick { 0% { transform: scale(0.82); opacity: 0; filter: drop-shadow(-6px 0 0 #00e5ff) drop-shadow(6px 0 0 #ff2a6d); } 60% { opacity: 1; filter: drop-shadow(-2px 0 0 #00e5ff) drop-shadow(2px 0 0 #ff2a6d); } 100% { transform: none; opacity: 1; filter: none; } }
body.xfer #load-fact { max-width: 540px; }
body.xfer .lr-pop { width: min(100% - 28px, 500px); }
body.xfer .lr-stat { font-size: clamp(30px, 2vw + 20px, 46px); }
body.xfer .lr-text { font-size: clamp(15.5px, 0.25vw + 14px, 18px); }

@media (min-width: 900px) { #load-fact { --jx: 36px; } }
@media (prefers-reduced-motion: reduce) {
	.lr-pop { animation: lr-fade-in 0.35s ease both; }
	.lr-pop.out { animation: lr-fade-out 0.3s ease both; }
	.lr-badge, .lr-tail { animation: none; }
	.lr-pop::after { display: none; }
	#load-bar { transition: none; }
	#load-logo, #load-logo *, #load-logo *::after, body.xfer #load-logo { animation: none !important; }
	.lr-arch { stroke-dashoffset: 0; }
	.lr-band { display: none; }
}
@keyframes lr-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes lr-fade-out { from { opacity: 1; } to { opacity: 0; } }
#status-progress { display: none !important; }
/* VR headsets (scripts/vr.gd, design/godot-vr.md): shown only where the browser can do immersive VR */
#vr-enter { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 900; display: none;
	font: 600 22px/1 -apple-system, system-ui, sans-serif; color: #fbf6ea; background: #5b2a3a; border: 2px solid #efe6d3;
	border-radius: 14px; padding: 18px 34px; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
#vr-enter.big { bottom: 50%; transform: translate(-50%, 50%); font-size: 30px; padding: 26px 48px; }
#vr-note { position: fixed; left: 0; right: 0; bottom: 96px; z-index: 900; display: none; text-align: center;
	font: 15px/1.4 -apple-system, system-ui, sans-serif; color: #fbf6ea; text-shadow: 0 1px 3px #000; pointer-events: none; }

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<button id="vr-enter" type="button">Enter VR</button>
		<div id="vr-note"></div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="" style="display:none">
			<progress id="status-progress"></progress>
	<div id="load-card">
		<div id="load-fact" aria-live="polite"></div>
		<div id="load-head">
			<div id="load-logo" aria-hidden="true">
				<svg id="lr-logo-svg" viewBox="0 0 540 440" focusable="false">
					<defs>
						<!-- gold paint with a pale band that sweeps across every few seconds (idle shimmer) -->
						<linearGradient id="lr-goldpaint" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="540" y2="160" gradientTransform="translate(-700 0)">
							<stop offset="0" stop-color="#ECC144"/><stop offset="0.44" stop-color="#ECC144"/>
							<stop offset="0.5" stop-color="#FFF3C2"/><stop offset="0.56" stop-color="#ECC144"/><stop offset="1" stop-color="#ECC144"/>
							<animateTransform attributeName="gradientTransform" type="translate" values="-700 0; 700 0; 700 0" keyTimes="0; 0.35; 1" dur="7s" begin="2.6s" repeatCount="indefinite"/>
						</linearGradient>
						<!-- dark specks on the big letters, sized for the logo's scale -->
						<filter id="lr-speck" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
							<feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="2" seed="11" result="n1"/>
							<feColorMatrix in="n1" type="matrix" values="0 0 0 0 0.122  0 0 0 0 0.098  0 0 0 0 0.024  16 0 0 0 -10.6" result="s1"/>
							<feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="3" seed="4" result="n2"/>
							<feColorMatrix in="n2" type="matrix" values="0 0 0 0 0.122  0 0 0 0 0.098  0 0 0 0 0.024  22 0 0 0 -15.6" result="s2"/>
							<feMerge result="s"><feMergeNode in="s1"/><feMergeNode in="s2"/></feMerge>
							<feComposite in="s" in2="SourceGraphic" operator="in" result="sin"/>
							<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sin"/></feMerge>
						</filter>
						<clipPath id="lr-cap-big"><rect x="0" y="313" width="540" height="120"/></clipPath>
						<clipPath id="lr-cap-oum"><rect x="0" y="321" width="540" height="58"/></clipPath>
						<clipPath id="lr-cap-mall"><rect x="0" y="394" width="540" height="31"/></clipPath>
					</defs>
					<!-- sunburst fan -->
					<g>
						<polygon class="lr-ray" points="270,236 180.1,192.2 191.2,174.4"/>
						<polygon class="lr-ray" points="270,236 191.3,145.4 208.2,133.1"/>
						<polygon class="lr-ray" points="270,236 217.6,106.2 240.9,99.1"/>
						<polygon class="lr-ray" points="270,236 255.6,86.7 284.4,86.7"/>
						<polygon class="lr-ray" points="270,236 299.1,99.1 322.4,106.2"/>
						<polygon class="lr-ray" points="270,236 331.8,133.1 348.7,145.4"/>
						<polygon class="lr-ray" points="270,236 348.8,174.4 359.9,192.2"/>
					</g>
					<!-- half-dome arch, two halves drawn from the bottom centre -->

const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}

		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';

	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {

				const lmb = document.getElementById('load-mb');
				if (current > 0 && total > 0 && lbar && lmb) {
					statusProgress.value = current;
					statusProgress.max = total;
					lbar.style.width = (100 * current / total).toFixed(1) + '%';
					lmb.textContent = '';

					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');

	}
