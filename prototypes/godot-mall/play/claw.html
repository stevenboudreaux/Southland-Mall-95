<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>CLAW</title>
<!--
  The playable claw machines in Pocket Change (Steven, Oct 11 2026).
  Walk up to any of the three cranes in the mall and press Play (scripts/signs.gd), or open this
  page directly: claw.html?machine=<1..3>&name=<title>. It stands you at that machine with the
  other two beside you as they stand in the mall (from the player's left: 3, 2, 1).
  Rules: claw/logic.js (the cycle from Steven's repair video; the rest guessed). Textures and
  geometry are the mall cabinet's own (tools/stores/pocket_change/crane.gd, paint_claw_game.py).
  The mall page shows this in a full-window frame and listens for "emu-close".
  Kept in this browser (localStorage): each machine's pile ("claw.pile.<n>", so prizes you moved
  stay moved and ones you won stay gone until the attendant refills it), the plays count, and
  the player's prizes ("mall.inventory": every prize won, with its tickets and POGs; "mall.tickets":
  the ticket total). The inventory is for the future: things to do with prizes later.
-->
<style>
  :root { --bg: #07060a; --fg: #f4f0e8; --dim: #a49eb2; --accent: #ffd23c; --red: #ff3a1e; --line: #2a2634; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
               font: 16px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; touch-action: none; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
         padding-top: env(safe-area-inset-top); background: #000; border-bottom: 1px solid var(--line); z-index: 20; }
  #bar b { flex: 1; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; color: var(--accent); }
  button { font: inherit; color: #1a0a20; background: var(--accent); border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 800; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid #3a3446; font-weight: 600; }
  #stage { position: fixed; top: calc(48px + env(safe-area-inset-top)); left: 0; right: 0; bottom: 0; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .chip { position: absolute; top: 10px; padding: 6px 12px; border-radius: 999px; background: rgba(8, 6, 14, .72);
          border: 1px solid rgba(255, 255, 255, .12); font-weight: 700; font-size: 15px; pointer-events: none; z-index: 5;
          font-variant-numeric: tabular-nums; }
  #clock { left: 10px; }
  #clock.low { color: var(--red); }
  #tix { right: 10px; text-align: right; }
  #tix span { color: var(--accent); }
  #tix small { display: block; font-size: 12px; color: var(--dim); font-weight: 600; }
  #pad { position: absolute; left: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%;
         background: rgba(8, 6, 14, .55); border: 1px solid rgba(255, 255, 255, .18); z-index: 6; display: none; touch-action: none; }
  #pad i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
           background: radial-gradient(circle at 35% 30%, #ff6a5a 0, #c01818 60%, #600a0a 100%); box-shadow: 0 4px 10px rgba(0,0,0,.6); }
  #drop { position: absolute; right: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 108px; height: 108px; border-radius: 50%;
          z-index: 6; display: none; font-size: 20px; letter-spacing: .06em; color: #2a0404;
          background: radial-gradient(circle at 40% 35%, #ff8a7a 0, #e02a1a 55%, #8a0c08 100%); border: 4px solid #cfd3da; box-shadow: 0 5px 14px rgba(0,0,0,.6); touch-action: none; }
  #drop:active { transform: translateY(2px); }
  #msg { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 7;
         width: min(440px, calc(100% - 24px)); text-align: center; pointer-events: none; }
  #msg .card { background: rgba(10, 6, 18, .9); border: 1px solid rgba(255, 210, 60, .35); border-radius: 16px; padding: 14px 16px 16px;
               box-shadow: 0 8px 30px rgba(0, 0, 0, .5); pointer-events: auto; }
  #msg h2 { margin: 0 0 4px; font-size: 26px; font-style: italic; letter-spacing: .05em; color: var(--accent);
            text-shadow: 0 0 12px rgba(255, 60, 30, .6), 2px 2px 0 #3a2a90; }
  #msg p { margin: 4px 0 10px; color: #ddd6e8; font-size: 15px; }
  #msg .big { font-size: 20px; padding: 12px 26px; }
  #msg .hint { pointer-events: none; display: inline-block; background: rgba(10, 6, 18, .7); border-radius: 999px; padding: 7px 14px;
               font-weight: 700; font-size: 14px; color: #fff; border: 1px solid rgba(255, 255, 255, .14); }
  #flash { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none; text-align: center;
           font-weight: 900; font-style: italic; font-size: clamp(30px, 8vw, 60px); color: #fff; letter-spacing: .04em; opacity: 0;
           text-shadow: 0 0 18px #ff3a1e, 0 0 4px #ff3a1e, 3px 3px 0 #3a2a90; transition: opacity .25s; white-space: nowrap; }
  #flash small { display: block; font-size: .42em; letter-spacing: .1em; }
  #inv { position: fixed; inset: 0; z-index: 25; background: rgba(4, 3, 8, .92); display: none; overflow: auto; padding: 60px 14px 30px; }
  #inv .wrap { max-width: 560px; margin: 0 auto; }
  #inv h2 { font-style: italic; color: var(--accent); letter-spacing: .05em; margin: 0 0 4px; }
  #inv .sub { color: var(--dim); margin-bottom: 14px; }
  #inv ul { list-style: none; padding: 0; margin: 0; }
  #inv li { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: #0e0b16; }
  #inv li .ic { width: 42px; height: 42px; border-radius: 10px; flex: none; background: #1a1424; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  #inv li .nm { flex: 1; font-weight: 700; }
  #inv li .nm small { display: block; color: var(--dim); font-weight: 500; font-size: 12px; }
  #inv li.rare { border-color: #ffd23c; box-shadow: 0 0 14px rgba(255, 210, 60, .25); }
  #inv .close { position: fixed; top: 10px; right: 10px; }
  #inv .empty { color: var(--dim); padding: 30px 0; text-align: center; }
  #load { position: fixed; inset: 0; z-index: 30; background: radial-gradient(circle at 50% 38%, #2c1010 0, #0b0710 60%, #050407 100%);
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #load h1 { margin: 0; font-size: clamp(38px, 11vw, 76px); font-style: italic; letter-spacing: .06em; color: var(--accent);
             text-shadow: 0 0 22px rgba(255, 60, 30, .75), 4px 4px 0 #3a2a90; }
  #load .sub { color: var(--dim); margin: 8px 0 26px; }
  #load .track { width: min(380px, 80vw); height: 10px; border-radius: 6px; background: #2a2236; overflow: hidden; }
  #load .bar { height: 100%; width: 0; background: linear-gradient(90deg, #ff3a1e, #ffd23c); transition: width .2s; }
  #load .err { color: #ff8a8a; margin-top: 14px; min-height: 1.4em; }
</style>
</head>
<body>
<div id="bar"><button class="ghost" id="back">&#8592; Mall</button><b id="title">CLAW</b><button class="ghost" id="prizes">Prizes</button><button class="ghost" id="snd" aria-label="Sound">&#128266;</button></div>
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="chip" id="clock">&nbsp;</div>
  <div class="chip" id="tix">TICKETS <span id="tk">0</span><small><span id="pc">0</span> PRIZES</small></div>
  <div id="pad"><i id="knob"></i></div>
  <button id="drop">DROP</button>
  <div id="flash"></div>
  <div id="msg"></div>
</div>
<div id="inv"><button class="ghost close" id="invclose">Close</button><div class="wrap"><h2>YOUR PRIZES</h2><div class="sub" id="invsub"></div><ul id="invlist"></ul></div></div>
<div id="load"><h1 id="ltitle">CLAW</h1><div class="sub" id="lsub">Pocket Change &middot; claw machine</div>
  <div class="track"><div class="bar" id="lbar"></div></div><div class="err" id="lerr"></div></div>
<script src="lib/three.min.js"></script>
<script src="claw/logic.js"></script>
<script>
(function () {
'use strict';
var CL = window.CLAW, CFG = CL.CONFIG, K = CL.KINDS, T3 = window.THREE;
var Q = new URLSearchParams(location.search);
var M = Math.max(1, Math.min(3, parseInt(Q.get('machine'), 10) || 1));
var TITLES = ['PRIZE CATCHER', 'LUCKY GRAB', 'SKILL CRANE'];
var NAME = (Q.get('name') || TITLES[M - 1]).slice(0, 24);
var inFrame = window.parent && window.parent !== window;
document.getElementById('title').textContent = NAME;
document.getElementById('ltitle').textContent = NAME;
document.getElementById('lsub').textContent = 'Pocket Change · claw machine ' + M + ' of 3';
document.title = NAME;

// ------------------------------------------------------------------ storage (per browser)
function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var soundOn = load('claw.sound', true) !== false;
var inventory = load('mall.inventory', []); if (!Array.isArray(inventory)) inventory = [];
var tickets = load('mall.tickets', 0); if (typeof tickets !== 'number' || tickets < 0) tickets = 0;
var pileKey = 'claw.pile.' + M;
var pile = load(pileKey, null);
function newFill() { var seed = (Date.now() ^ (M * 7919)) >>> 0; return { seed: seed, plays: 0, items: CL.fill(seed) }; }
if (!pile || !Array.isArray(pile.items) || !pile.items.every(function (i) { return i && K[i.kind] && typeof i.x === 'number'; })) pile = newFill();
if (pile.items.length < CFG.refillBelow) pile = newFill();
CL.settle(pile.items);
save(pileKey, pile);
function now() { return performance.now(); }

// ------------------------------------------------------------------ renderer
var stage = document.getElementById('stage'), canvas = document.getElementById('gl'), renderer;
try { renderer = new T3.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { document.getElementById('lerr').textContent = 'This browser could not start 3D graphics.'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = T3.SRGBColorSpace;
renderer.toneMapping = T3.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
var scene = new T3.Scene();
scene.background = new T3.Color(0x050407);
scene.fog = new T3.Fog(0x050407, 5, 11);
var camera = new T3.PerspectiveCamera(50, 1, 0.03, 30);

// The three cranes stand side by side as in the mall (store.gd wall_run, 0.02 m apart), from the
// player's left: 3, 2, 1. This page's x = 0 is the middle of the chosen one; three's z = -lane z.
var PITCH = 0.82;
function mx(n) { return (M - n) * PITCH; }
function V(n, x, y, z) { return new T3.Vector3(mx(n) + x, y, -z); }
function H(x, y, z) { return new T3.Vector3(x, y, -z); }

// ------------------------------------------------------------------ textures
var TEX = {};
var TEX_LIST = ['cab_0', 'cab_1', 'cab_2', 'header_0', 'header_1', 'header_2', 'panel', 'glass', 'fur', 'faces', 'pogs', 'capsule', 'store_carpet', 'store_wall'];
var loader = new T3.TextureLoader();
function loadAll(done) {
  var n = 0, failed = false;
  TEX_LIST.forEach(function (k) {
    loader.load('claw/' + k + '.webp', function (t) {
      t.colorSpace = T3.SRGBColorSpace; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      TEX[k] = t; n++;
      document.getElementById('lbar').style.width = (100 * n / TEX_LIST.length) + '%';
      if (n === TEX_LIST.length && !failed) done();
    }, undefined, function () { failed = true; document.getElementById('lerr').textContent = 'Could not load the machine (' + k + '). Check the connection and reload.'; });
  });
}

// ------------------------------------------------------------------ geometry builder (as skeeball.html)
function Builder() { this.s = {}; }
Builder.prototype.surf = function (k) { return this.s[k] || (this.s[k] = { p: [], n: [], uv: [] }); };
Builder.prototype.tri = function (k, a, b, c, ua, ub, uc, na, nb, nc) {
  var s = this.surf(k);
  [[a, ua, na], [b, ub, nb], [c, uc, nc]].forEach(function (e) { s.p.push(e[0].x, e[0].y, e[0].z); s.n.push(e[2].x, e[2].y, e[2].z); s.uv.push(e[1][0], 1 - e[1][1]); });
};
Builder.prototype.quad = function (k, p, uv, hint, normals) {
  uv = uv || [[0, 1], [1, 1], [1, 0], [0, 0]];
  var n = new T3.Vector3().subVectors(p[1], p[0]).cross(new T3.Vector3().subVectors(p[3], p[0]));
  if (n.lengthSq() < 1e-12) n = new T3.Vector3().subVectors(p[2], p[1]).cross(new T3.Vector3().subVectors(p[3], p[1]));
  n.normalize();
  var flip = hint && n.dot(hint) < 0; if (flip) n.negate();
  var N = normals || [n, n, n, n];
  if (!flip) { this.tri(k, p[0], p[1], p[2], uv[0], uv[1], uv[2], N[0], N[1], N[2]); this.tri(k, p[0], p[2], p[3], uv[0], uv[2], uv[3], N[0], N[2], N[3]); }
  else { this.tri(k, p[0], p[2], p[1], uv[0], uv[2], uv[1], N[0], N[2], N[1]); this.tri(k, p[0], p[3], p[2], uv[0], uv[3], uv[2], N[0], N[3], N[2]); }
};
// a box in the lane frame: c = centre (world), size [sx, sy, sz]; skip = faces to leave out ('+y' ...)
Builder.prototype.box = function (k, c, size, skip) {
  var hx = size[0] / 2, hy = size[1] / 2, hz = size[2] / 2, self = this; skip = skip || [];
  function P(x, y, z) { return new T3.Vector3(c.x + x, c.y + y, c.z - z); }
  var F = [['-z', [-hx, -hy, -hz], [hx, -hy, -hz], [hx, hy, -hz], [-hx, hy, -hz], [0, 0, -1]], ['+z', [hx, -hy, hz], [-hx, -hy, hz], [-hx, hy, hz], [hx, hy, hz], [0, 0, 1]],
           ['+y', [-hx, hy, -hz], [hx, hy, -hz], [hx, hy, hz], [-hx, hy, hz], [0, 1, 0]], ['-y', [-hx, -hy, hz], [hx, -hy, hz], [hx, -hy, -hz], [-hx, -hy, -hz], [0, -1, 0]],
           ['-x', [-hx, -hy, hz], [-hx, -hy, -hz], [-hx, hy, -hz], [-hx, hy, hz], [-1, 0, 0]], ['+x', [hx, -hy, -hz], [hx, -hy, hz], [hx, hy, hz], [hx, hy, -hz], [1, 0, 0]]];
  F.forEach(function (f) { if (skip.indexOf(f[0]) >= 0) return; self.quad(k, [P.apply(null, f[1]), P.apply(null, f[2]), P.apply(null, f[3]), P.apply(null, f[4])], null, H(f[5][0], f[5][1], f[5][2])); });
};
Builder.prototype.meshes = function (mats, group) {
  for (var k in this.s) {
    var s = this.s[k], g = new T3.BufferGeometry();
    g.setAttribute('position', new T3.Float32BufferAttribute(s.p, 3)); g.setAttribute('normal', new T3.Float32BufferAttribute(s.n, 3)); g.setAttribute('uv', new T3.Float32BufferAttribute(s.uv, 2));
    group.add(new T3.Mesh(g, mats(k)));
  }
};
function px(x0, y0, x1, y1, tw, th) { return [[x0 / tw, y1 / th], [x1 / tw, y1 / th], [x1 / tw, y0 / th], [x0 / tw, y0 / th]]; }

// ------------------------------------------------------------------ materials (crane.gd fill_mat)
var MATS = {}, S = T3.MeshStandardMaterial;
var CAB_COL = [0x18181b, 0x1c3890, 0x961418], BTN_COL = [0xff2a1a, 0xffd21a, 0x27e04a];
function texRepeat(t) { var c = t.clone(); c.wrapS = c.wrapT = T3.RepeatWrapping; c.needsUpdate = true; return c; }
function mat(k) {
  if (MATS[k]) return MATS[k];
  var m, st = parseInt(k.slice(-1), 10), base = /\d$/.test(k) ? k.slice(0, -1) : k;
  switch (base) {
    case 'cab': m = new S({ map: TEX['cab_' + st], roughness: 0.45 }); break;
    case 'body': m = new S({ color: CAB_COL[st], roughness: 0.45 }); break;
    case 'hdr': m = new S({ map: TEX['header_' + st], emissiveMap: TEX['header_' + st], emissive: 0xffffff, emissiveIntensity: 0.9, roughness: 0.25 }); break;
    case 'btn': m = new S({ color: BTN_COL[st], emissive: BTN_COL[st], emissiveIntensity: 0.8, roughness: 0.25 }); break;
    case 'panel': m = new S({ map: TEX.panel, roughness: 0.5 }); break;
    case 'lamp': m = new S({ map: TEX.panel, emissiveMap: TEX.panel, emissive: 0xffffff, emissiveIntensity: 1.2, roughness: 0.3 }); break;
    case 'blk': m = new S({ color: 0x121214, roughness: 0.5 }); break;
    case 'hole': m = new S({ color: 0x040404, roughness: 1 }); break;
    case 'deck': m = new S({ color: 0x1e1e22, roughness: 0.95 }); break;
    case 'alu': m = new S({ color: 0xc2c6cc, metalness: 0.85, roughness: 0.32 }); break;
    case 'chrome': m = new S({ color: 0xe6e9ee, metalness: 0.75, roughness: 0.16 }); break;
    case 'steel': m = new S({ color: 0x5a5d63, metalness: 0.6, roughness: 0.45 }); break;
    case 'ball': m = new S({ color: 0xd01818, roughness: 0.2 }); break;
    case 'glass': m = new S({ map: TEX.glass, transparent: true, opacity: 0.5, roughness: 0.05, metalness: 0.1, side: T3.DoubleSide, depthWrite: false }); break;
    case 'tube': m = new S({ color: 0xffffff, emissive: 0xeef5ff, emissiveIntensity: 2.5 }); break;
    case 'ceil': m = new S({ color: 0xe8ecf0, emissive: 0xe6eeff, emissiveIntensity: 0.5, roughness: 0.8 }); break;
    case 'floor': var ct = texRepeat(TEX.store_carpet); ct.repeat.set(6, 6); m = new S({ map: ct, color: 0x9a9aa6, roughness: 0.95 }); break;
    case 'wall': var wt = texRepeat(TEX.store_wall); wt.repeat.set(4, 1.5); m = new S({ map: wt, color: 0x6a6670, roughness: 0.85 }); break;
    default: m = new S({ color: 0xff00ff });
  }
  MATS[k] = m; return m;
}
function furMat(hex) {
  var key = 'fur' + hex; if (MATS[key]) return MATS[key];
  var m = new S({ map: TEX.fur, color: hex, roughness: 0.95 }); MATS[key] = m; return m;
}
function faceMat(i) {
  var key = 'face' + i; if (MATS[key]) return MATS[key];
  var t = TEX.faces.clone(); t.needsUpdate = true; t.repeat.set(0.25, 0.5); t.offset.set((i % 4) * 0.25, 0.5 - Math.floor(i / 4) * 0.5);
  var m = new S({ map: t, transparent: true, alphaTest: 0.4, roughness: 0.3, polygonOffset: true, polygonOffsetFactor: -2 }); MATS[key] = m; return m;
}
function pogMat(i) {
  var key = 'pog' + i; if (MATS[key]) return MATS[key];
  var t = TEX.pogs.clone(); t.needsUpdate = true; t.repeat.set(0.25, 0.5); t.offset.set((i % 4) * 0.25, 0.5 - Math.floor(i / 4) * 0.5);
  var m = new S({ map: t, roughness: 0.4, metalness: i === 5 ? 0.6 : 0 }); MATS[key] = m; return m;
}

// ------------------------------------------------------------------ prizes (this mall's own characters)
var G = { W: 0.80, D: 0.90, H: 1.98, Z_CAB: 0.05, Z_PNL: 0.17, Y_PF: 0.905, Y_PB: 0.93, Y_DECK: 0.955, Y_G0: 0.96, Y_G1: 1.60, Y_HD: 1.64, PX: 550 };
function ell(rx, ry, rz, m, seg) { var g = new T3.SphereGeometry(1, seg || 14, seg ? Math.max(6, seg - 4) : 10); var o = new T3.Mesh(g, m); o.scale.set(rx, ry, rz); return o; }
function at(o, x, y, z) { o.position.set(x, y, z); return o; }
function decal(i, size, x, y, z, ry, rx) { var q = new T3.Mesh(new T3.PlaneGeometry(size, size), faceMat(i)); q.position.set(x, y, z); q.rotation.set(rx || 0, ry || 0, 0); return q; }
var CAPSULE_MAT = null;
function capsuleMats() {
  if (CAPSULE_MAT) return CAPSULE_MAT;
  CAPSULE_MAT = { clear: new S({ color: 0xffffff, transparent: true, opacity: 0.28, roughness: 0.05, metalness: 0.1, depthWrite: false, side: T3.DoubleSide }),
                  rims: [new S({ color: 0xff4a3a, roughness: 0.3 }), new S({ color: 0x3a7aff, roughness: 0.3 }), new S({ color: 0x3ad06a, roughness: 0.3 }), new S({ color: 0xffd23c, roughness: 0.3 })],
                  paper: new S({ color: 0xf3eee0, roughness: 0.9 }), card: pogMat(6), metal: pogMat(7) };
  return CAPSULE_MAT;
}
function ticketRoll(val) {
  var row = val === 75 ? 0 : val === 100 ? 1 : 2;
  var t = TEX.capsule.clone(); t.needsUpdate = true; t.wrapS = T3.RepeatWrapping; t.repeat.set(2.4, 1 / 3); t.offset.set(0, 1 - (row + 1) / 3);
  var side = new S({ map: t, roughness: 0.8 });
  var g = new T3.Group();
  var roll = new T3.Mesh(new T3.CylinderGeometry(0.026, 0.026, 0.022, 24, 1, false), [side, capsuleMats().paper, capsuleMats().paper]);
  roll.rotation.z = Math.PI / 2; g.add(roll);
  var core = new T3.Mesh(new T3.CylinderGeometry(0.009, 0.009, 0.024, 12), new S({ color: 0x2a2a2a })); core.rotation.z = Math.PI / 2; g.add(core);
  return g;
}
function pogStack(faces, slammer) {
  var g = new T3.Group();
  for (var i = 0; i < faces.length; i++) {
    var th = slammer ? 0.006 : 0.0015;
    var disc = new T3.Mesh(new T3.CylinderGeometry(0.021, 0.021, th, 28), [slammer ? capsuleMats().metal : capsuleMats().card, pogMat(faces[i]), slammer ? pogMat(7) : pogMat(6)]);
    disc.position.set(0, -0.012 + i * (th + 0.0012), 0); disc.rotation.y = i * 0.4; g.add(disc);
  }

// ------------------------------------------------------------------ the claw cycle (from the video: down until slack, close, up, home, open)
function stepCycle(t, dt) {
  var el = (t - ST.phaseT0) / 1000;
  if (ST.phase === 'down') {
    ST.clawY = Math.max(ST.dropAt, ST.phaseY - CFG.dropSpeed * el);
    if (ST.clawY <= ST.dropAt + 1e-6) { ST.phase = 'close'; ST.phaseT0 = t; setHum(false); SFX.clack(); }
  } else if (ST.phase === 'close') {
    ST.open = Math.max(0, 1 - el * 1000 / CFG.closeMs);
    if (el * 1000 >= CFG.closeMs) {
      ST.res = CL.judge(ST.tgt, ST.grip); ST.grabX = ST.pos[0]; ST.grabZ = ST.pos[1];
      if (ST.res.lifted) { ST.carried = meshes[ST.res.item.id]; ST.open = 0.15; }
      else ST.open = ST.tgt ? 0.3 : 0.05;
      ST.phase = 'up'; ST.phaseT0 = t; ST.phaseY = ST.clawY; setHum(true, 180);
    }
  } else if (ST.phase === 'up') {
    ST.clawY = Math.min(CFG.clawTopY, ST.phaseY + CFG.liftSpeed * el);
    if (ST.clawY >= CFG.clawTopY - 1e-6) {
      if (errorMode) { ST.phase = 'error'; ST.phaseT0 = t; setHum(false); SFX.error(); }
      else { ST.phase = 'home'; ST.phaseT0 = t; ST.homeFrom = ST.pos.slice(); ST.homeLen = Math.hypot(CFG.home[0] - ST.pos[0], CFG.home[1] - ST.pos[1]); setHum(true, 120); }
    }
  } else if (ST.phase === 'home') {
    var f = ST.homeLen > 1e-6 ? Math.min(1, el * CFG.homeSpeed / ST.homeLen) : 1;
    ST.pos = [ST.homeFrom[0] + (CFG.home[0] - ST.homeFrom[0]) * f, ST.homeFrom[1] + (CFG.home[1] - ST.homeFrom[1]) * f];
    if (ST.carried && ST.res.carry < 1 && f >= ST.res.carry) {
      // the grip gives: the prize slips and falls back into the pile (or into the chute)
      var fellIn = CL.inChute(ST.pos[0], ST.pos[1]);
      dropPrize(ST.carried, fellIn); ST.carried = null; ST.open = 0.6; SFX.thud();
      if (fellIn) SFX.chute();
    }
    if (f >= 1) { ST.phase = 'open'; ST.phaseT0 = t; setHum(false); }
  } else if (ST.phase === 'open') {
    ST.open = Math.min(1, 0.15 + el * 1000 / CFG.openMs);
    if (el * 1000 >= CFG.openMs) {
      if (ST.carried) { dropPrize(ST.carried, true); ST.carried = null; SFX.chute(); }
      ST.phase = 'done'; ST.phaseT0 = t;
    }
  } else if (ST.phase === 'done') {
    if (el > 0.9) finishPlay();
  } else if (ST.phase === 'error') {

  }
}

}

  var hf = 40 * Math.PI / 180, vf = 2 * Math.atan(Math.tan(hf / 2) / asp) * 180 / Math.PI;
  camera.fov = Math.max(52, Math.min(78, vf));
  var portrait = asp < 0.8;
  camera.position.set(0.05, portrait ? 1.58 : 1.52, portrait ? 0.62 : 0.55);
  camera.lookAt(0, portrait ? 1.22 : 1.24, -0.55);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', layout);

// ------------------------------------------------------------------ frame loop
var tPrev = now(), refs = {};
function frame() {
  requestAnimationFrame(frame);
  var t = now(), dt = Math.min(0.05, (t - tPrev) / 1000); tPrev = t;
  pollPads();
  if (ST.mode === 'play') {
    var kx = (keys.ArrowLeft || keys.KeyA ? -1 : 0) + (keys.ArrowRight || keys.KeyD ? 1 : 0), kz = (keys.ArrowDown || keys.KeyS ? -1 : 0) + (keys.ArrowUp || keys.KeyW ? 1 : 0);
    var jx = joy[0] || kx, jz = joy[1] || kz;
    if (jx || jz) { ST.pos = CL.move(ST.pos, jx, jz, dt); setHum(true, 110 + 30 * Math.hypot(jx, jz)); } else setHum(false);
    ST.lastJoy = [jx, jz];
    var left = Math.max(0, CFG.playMs - (t - ST.t0));
    var cl = document.getElementById('clock'); cl.textContent = Math.ceil(left / 1000) + ' s'; cl.classList.toggle('low', left < 6000);
    if (left <= 0) startDrop(true);
  } else if (ST.mode === 'drop') {
    stepCycle(t, dt);
    document.getElementById('clock').textContent = ST.phase === 'error' ? 'ERR 01' : '···';
  } else { document.getElementById('clock').textContent = ST.mode === 'title' ? 'INSERT TOKEN' : ''; ST.lastJoy = [0, 0]; }
  // the live machine's moving parts
  setGantry(refLive, M, ST.pos[0], ST.pos[1], ST.clawY, ST.open);
  if (live.stick) { live.stick.rotation.set(-ST.lastJoy[1] * 0.35, 0, -ST.lastJoy[0] * 0.35); }
  if (live.btn) { live.btn.position.y = (t - pressFx < 150) ? -0.004 : 0; live.btn.material.emissiveIntensity = ST.mode === 'play' ? (Math.floor(t / 400) % 2 ? 1.6 : 0.6) : 0.8; }
  if (ST.carried) {
    var ci = ST.carried.userData.item, kk = K[ci.kind];
    ST.carried.position.copy(V(M, ST.pos[0], ST.clawY - 0.19 - kk.h * 0.5 + (ST.carried.userData.lift || 0) + 0.02 * Math.sin(t / 150), ST.pos[1]));
    ST.carried.rotation.z = 0.15 * Math.sin(t / 300);
  }
  falling = falling.filter(function (f) {
    var el = (t - f.t0) / 1000, y;
    if (f.chute) { y = f.from.y - 4.9 * el * el; f.g.position.set(f.from.x, y, f.from.z); f.g.rotation.x += dt * 3; if (y < 0.55) { live.prizes.remove(f.g); return false; } return true; }
    var it = f.item, k = K[it.kind], target = CFG.deckY + (f.landY || 0);
    if (f.landY === undefined) { // where the pile will hold it: settle a copy
      var tmp = pile.items.filter(function (o) { return o.id !== it.id; }).map(function (o) { return { kind: o.kind, x: o.x, z: o.z, y: o.y }; });
      tmp.push({ kind: it.kind, x: ST.pos[0], z: ST.pos[1], y: 0 }); CL.settle(tmp); f.landY = tmp[tmp.length - 1].y - CFG.deckY; target = tmp[tmp.length - 1].y; }
    y = Math.max(target + (f.g.userData.lift || 0), f.from.y - 4.9 * el * el);
    f.g.position.set(f.from.x, y, f.from.z);
    return el < 1.2;
  });
  renderer.render(scene, camera);
}

// ------------------------------------------------------------------ start
loadAll(function () {
  [3, 2, 1].forEach(function (n) {
    var st = n - 1, items = n === M ? pile.items : CL.fill(4000 + n);
    refs[n] = buildCrane(n, st, items);
    if (n === M) { refLive = refs[n]; pile.items.forEach(function (it) { refs[n].prizes.children.forEach(function (g) { if (g.userData.item === it) meshes[it.id] = g; }); }); }
    else { var hp = [[-0.2, 0.5], [0.1, 0.6], [0.2, 0.4]][st]; setGantry(refs[n], n, hp[0], hp[1], 1.45, 1); }
  });
  buildRoom();
  setGantry(refLive, M, ST.pos[0], ST.pos[1], ST.clawY, ST.open);
  layout(); ui();
  document.getElementById('load').style.display = 'none';
  frame();
  window.__claw = { ST: ST, CL: CL, pile: function () { return pile; }, start: insertToken, drop: startDrop, setPos: function (x, z) { ST.pos = [x, z]; },
                    setGrip: function (g) { ST.grip = g; }, inventory: function () { return inventory; }, error: function () { errorMode = true; } };
});
})();
</script>
