<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WHIRLWIND</title>
<!--
  The playable light-ring ticket game in Pocket Change (Steven, Oct 9 2026).
  Walk up to the WHIRLWIND cabinet in the mall and press Play (scripts/signs.gd), or open
  this page directly. whirlwind.html?name=<title> shows the cabinet's owner-edited name.
  Rules and timing: whirlwind/logic.js (measured from Steven's video). Textures are the
  mall cabinet's own (tools/stores/pocket_change/paint_whirlwind_game.py).
  The mall page shows this in a full-window frame and listens for "emu-close".
  Kept in this browser (localStorage): the bonus ("whirlwind.bonus") and the best $1.00
  score ("whirlwind.best").
-->
<style>
  :root { --bg: #07060a; --fg: #f4f0e8; --dim: #a49eb2; --accent: #ffd23c; --pink: #f43e9c; --line: #2a2634; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
               font: 16px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; touch-action: none; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
         padding-top: env(safe-area-inset-top); background: #000; border-bottom: 1px solid var(--line); z-index: 20; }
  #bar b { flex: 1; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; color: var(--accent); }
  button { font: inherit; color: #1a0a20; background: var(--accent); border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 800; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid #3a3446; font-weight: 600; }
  #stage { position: fixed; top: calc(48px + env(safe-area-inset-top)); left: 0; right: 0; bottom: 0; cursor: pointer; }
  #gl, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { pointer-events: none; }
  .chip { position: absolute; top: 10px; padding: 6px 12px; border-radius: 999px; background: rgba(8, 6, 14, .72);
          border: 1px solid rgba(255, 255, 255, .12); font-weight: 700; font-size: 15px; pointer-events: none; z-index: 5;
          font-variant-numeric: tabular-nums; }
  #plays { left: 10px; display: flex; gap: 6px; align-items: center; }
  #plays i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0, #d8d8dc 35%, #8a8a94 100%);
             box-shadow: inset 0 0 0 1.5px #6c6c76; display: inline-block; }
  #plays i.used { background: transparent; box-shadow: inset 0 0 0 1.5px #4a4656; }
  #score { right: 10px; text-align: right; }
  #score span { color: var(--accent); }
  #score small { display: block; font-size: 12px; color: var(--dim); font-weight: 600; }
  #msg { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6;
         width: min(440px, calc(100% - 24px)); text-align: center; pointer-events: none; }
  #msg .card { background: rgba(10, 6, 18, .86); border: 1px solid rgba(255, 210, 60, .35); border-radius: 16px; padding: 14px 16px 16px;
               box-shadow: 0 8px 30px rgba(0, 0, 0, .5); pointer-events: auto; }
  #msg h2 { margin: 0 0 4px; font-size: 26px; font-style: italic; letter-spacing: .05em; color: var(--accent);
            text-shadow: 0 0 12px rgba(255, 120, 200, .6), 2px 2px 0 #3a2a90; }
  #msg p { margin: 4px 0 10px; color: #ddd6e8; font-size: 15px; }
  #msg .big { font-size: 20px; padding: 12px 26px; }
  #msg .hint { pointer-events: none; display: inline-block; background: rgba(10, 6, 18, .7); border-radius: 999px; padding: 7px 14px;
               font-weight: 700; font-size: 14px; color: #fff; border: 1px solid rgba(255, 255, 255, .14); }
  #skip { position: absolute; right: 10px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 7; display: none; }
  #flash { position: absolute; left: 50%; top: 20%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none; text-align: center;
           font-weight: 900; font-style: italic; font-size: clamp(28px, 7vw, 54px); color: #fff; letter-spacing: .04em; opacity: 0;
           text-shadow: 0 0 18px #ff3ca0, 0 0 4px #ff3ca0, 3px 3px 0 #3a2a90; transition: opacity .2s; white-space: nowrap; }
  @media (min-aspect-ratio: 1/1) { #flash { top: 10px; transform: translate(-50%, 0); } }
  #flash small { display: block; font-size: .42em; letter-spacing: .1em; }
  #load { position: fixed; inset: 0; z-index: 30; background: radial-gradient(circle at 50% 38%, #2a0f2c 0, #0b0710 60%, #050407 100%);
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #load h1 { margin: 0; font-size: clamp(38px, 11vw, 76px); font-style: italic; letter-spacing: .06em; color: var(--accent);
             text-shadow: 0 0 22px rgba(255, 60, 160, .75), 4px 4px 0 #3a2a90; }
  #load .sub { color: var(--dim); margin: 8px 0 26px; }
  #load .track { width: min(380px, 80vw); height: 10px; border-radius: 6px; background: #2a2236; overflow: hidden; }
  #load .bar { height: 100%; width: 0; background: linear-gradient(90deg, #f43e9c, #ffd23c); transition: width .2s; }
  #load .err { color: #ff8a8a; margin-top: 14px; min-height: 1.4em; }
</style>
</head>
<body>
<div id="bar"><button class="ghost" id="back">&#8592; Back to the mall</button><b id="title">WHIRLWIND</b><button class="ghost" id="snd" aria-label="Sound">&#128266;</button></div>
<div id="stage">
  <canvas id="gl"></canvas><canvas id="fx"></canvas>
  <div class="chip" id="plays"></div>
  <div class="chip" id="score">TICKETS <span id="tk">0</span><small>BEST <span id="best">0</span></small></div>
  <div id="flash"></div>
  <div id="msg"></div>
  <button id="skip">SKIP &#9654;&#9654;</button>
</div>
<div id="load"><h1 id="ltitle">WHIRLWIND</h1><div class="sub">Pocket Change &middot; light-ring ticket game</div>
  <div class="track"><div class="bar" id="lbar"></div></div><div class="err" id="lerr"></div></div>
<script src="whirlwind/logic.js"></script>
<script>
(function () {
'use strict';
var WW = window.WW, CFG = WW.CONFIG, VALUES = WW.ringValues();
var Q = new URLSearchParams(location.search);
var NAME = (Q.get('name') || 'WHIRLWIND').slice(0, 24);
document.getElementById('title').textContent = NAME;
document.getElementById('ltitle').textContent = NAME;
document.title = NAME;
var inFrame = window.parent && window.parent !== window;

// ------------------------------------------------------------------ storage (per browser)
function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var bonus = load('whirlwind.bonus', CFG.bonusStart);
if (typeof bonus !== 'number' || !(bonus >= CFG.bonusStart) || bonus > 9999) bonus = CFG.bonusStart;
var best = load('whirlwind.best', 0);
if (typeof best !== 'number' || best < 0) best = 0;
var soundOn = load('whirlwind.sound', true) !== false;

// ------------------------------------------------------------------ cabinet geometry (metres)
// x = the player's right, y = up, z = into the machine (the console's front face is z = 0).
// Matches tools/stores/pocket_change/cyclone.gd and scripts/cyclone_lights.gd.
var G = {
  HW: 0.63, D: 1.30, CX: 0.53, Y0: 0.035, YT: 0.935, DECK: 0.96, FY: 0.95,
  C: [0, 0.95, 0.70], DOME_Y: 0.975, DOME_R: 0.535, FL0: 0.53, FL1: 0.565,
  CON_A: [0.70, -0.015], CON_B: [0.975, 0.125], CON_BACK: 0.145,
  BULB_R: 0.372, BULB: 0.0118,
  SLOT_X: 0.175, SLOT_Y: 0.275,
  TICKET_L: 0.052, TICKET_W: 0.046
};
var DEG = Math.PI / 180;
function ringXZ(thDeg, r) { var t = thDeg * DEG; return [-Math.sin(t) * r, G.C[2] - Math.cos(t) * r]; }
var NEON = { GREEN: [64, 255, 97], PINK: [255, 82, 173], CYAN: [77, 209, 255], WHITE: [242, 230, 255] };
var ARCHES = [[92, .33, .47, .13, 'GREEN', 0], [-92, .33, .47, .13, 'PINK', 1], [140, .33, .47, .12, 'GREEN', 0],
              [-140, .33, .47, .12, 'CYAN', 2], [8, .265, .335, .17, 'PINK', 1], [-8, .265, .335, .17, 'WHITE', 3]];
var POSTS = [[180, .31, .11, 'CYAN', 2]];
var COILS = [[[-0.115, 0.0], .085, -0.02, .13, 1.75, 'GREEN', 0], ['post', .11, -0.01, .06, 1.25, 'PINK', 1],
             [[0.115, -0.01], .08, -0.01, .12, 1.5, 'CYAN', 2]];
var POST_FOOT = [0, G.C[2] - 0.08];      // the BONUS readout's post (paint_cyclone.py: pink foot at cy + 0.08)
var BOX = { z: 0.62, y: 0.155, w: 0.24, h: 0.165, d: 0.045, tilt: 12 };
var TOWER = { th: 122, r: 0.30, h: 0.21, s: 0.10, tilt: 35 };

// neon tubes as 3D polylines
var tubes = [];
(function () {
  ARCHES.forEach(function (a) {
    var pts = [], rc = (a[1] + a[2]) / 2, rh = (a[2] - a[1]) / 2;
    for (var k = 0; k <= 24; k++) {
      var s = Math.PI * k / 24, r = rc - Math.cos(s) * rh, xz = ringXZ(a[0], r);
      pts.push([xz[0], G.FY + Math.sin(s) * a[3], xz[1]]);
    }
    tubes.push({ pts: pts, col: NEON[a[4]], grp: a[5], arch: true, w: 0.0105 });
  });
  POSTS.forEach(function (p) {
    var xz = ringXZ(p[0], p[1]);
    tubes.push({ pts: [[xz[0], G.FY, xz[1]], [xz[0], G.FY + p[2], xz[1]]], col: NEON[p[3]], grp: p[4], arch: true, w: 0.0105 });
  });
  COILS.forEach(function (c) {
    var cx, cz;
    if (c[0] === 'post') { cx = POST_FOOT[0]; cz = POST_FOOT[1]; } else { cx = c[0][0]; cz = G.C[2] - c[0][1]; }
    var pts = [], n = Math.ceil(c[4] * 28);
    for (var k = 0; k <= n; k++) {
      var s = k / n, an = s * c[4] * Math.PI * 2;
      pts.push([cx + Math.cos(an) * c[1], G.FY + c[2] + s * (c[3] - c[2]), cz + Math.sin(an) * c[1]]);
    }
    tubes.push({ pts: pts, col: NEON[c[5]], grp: c[6], coil: true, w: 0.009 });
  });
  // the BONUS slot's two tall white tubes either side of its cap (Steven's video)
  var bz = G.C[2] - 0.435;
  [-0.034, 0.034].forEach(function (x) {
    tubes.push({ pts: [[x, G.FY + 0.012, bz], [x, G.FY + 0.105, bz]], col: [210, 240, 255], grp: 'bonus', w: 0.009 });
  });
})();

// ------------------------------------------------------------------ assets
var IMG = {};
var NAMES = ['field', 'console', 'bonus', 'button', 'deck', 'tower', 'front'];
function loadAssets(done) {
  var n = 0, failed = false;
  NAMES.forEach(function (nm) {
    var im = new Image();
    im.onload = function () { IMG[nm] = im; n++; document.getElementById('lbar').style.width = (100 * n / NAMES.length) + '%'; if (n === NAMES.length) done(); };
    im.onerror = function () { if (!failed) { failed = true; document.getElementById('lerr').textContent = 'Could not load the game. Check your connection and reload.'; } };
    im.src = 'whirlwind/' + nm + '.webp';
  });
}

// ------------------------------------------------------------------ WebGL
var cv = document.getElementById('gl'), fx = document.getElementById('fx'), stage = document.getElementById('stage');
var gl = cv.getContext('webgl', { antialias: true, alpha: false, premultipliedAlpha: false }) ||
         cv.getContext('experimental-webgl');
var ctx = fx.getContext('2d');
if (!gl) { document.getElementById('lerr').textContent = 'This browser cannot show the game (WebGL is off).'; return; }

var VS = 'attribute vec3 aP; attribute vec2 aT; attribute vec3 aN; uniform mat4 uM; varying vec2 vT; varying vec3 vW; varying vec3 vN;' +
  'void main(){ vT=aT; vW=aP; vN=aN; gl_Position=uM*vec4(aP,1.0); }';
var FS = 'precision mediump float; varying vec2 vT; varying vec3 vW; varying vec3 vN;' +
  'uniform sampler2D uTex; uniform vec4 uCol; uniform float uLit; uniform float uRecv; uniform vec4 uL; uniform float uFlash;' +
  'uniform float uDome; uniform vec3 uEye; uniform vec3 uDomeC; uniform vec3 uEmit; uniform float uShade;' +
  'void main(){' +
  ' if(uDome>0.5){ vec3 N=normalize(vW-uDomeC); vec3 V=normalize(uEye-vW); float f=pow(1.0-abs(dot(N,V)),3.0);' +
  '   float s=pow(max(dot(reflect(-V,N),normalize(vec3(-0.3,0.9,0.35))),0.0),40.0);' +
  '   gl_FragColor=vec4(vec3(0.82,0.9,1.0)*(0.35+f)+s*0.8, 0.035+0.42*f+s*0.6); return; }' +
  ' vec4 t=texture2D(uTex,vT)*uCol; float sh=mix(1.0,0.42+0.68*max(dot(normalize(vN),normalize(vec3(0.25,1.0,0.65))),0.0),uShade);' +
  ' vec3 c=t.rgb*uLit*sh*(1.0+uFlash);' +
  ' if(uRecv>0.5){ float d=distance(vW,uL.xyz); c+=t.rgb*vec3(1.0,0.72,0.32)*uL.w*0.0016/(d*d+0.0012); }' +
  ' gl_FragColor=vec4(c+uEmit,t.a); }';
function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
var prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
gl.useProgram(prog);
var A = { p: gl.getAttribLocation(prog, 'aP'), t: gl.getAttribLocation(prog, 'aT'), n: gl.getAttribLocation(prog, 'aN') };
var U = {};
['uM', 'uTex', 'uCol', 'uLit', 'uRecv', 'uL', 'uFlash', 'uDome', 'uEye', 'uDomeC', 'uEmit', 'uShade'].forEach(function (k) { U[k] = gl.getUniformLocation(prog, k); });

function W(p) { return [p[0], p[1], -p[2]]; }       // cabinet coords -> GL (right-handed, -z forward)
function Mesh() { this.v = []; }
Mesh.prototype.tri = function (a, b, c) { this.v.push.apply(this.v, a.concat(b, c)); };
// vertex: [x,y,z,u,v,nx,ny,nz] in cabinet coords
function vx(p, u, v, n) { var q = W(p), m = n ? W(n) : [0, 1, 0]; return [q[0], q[1], q[2], u, v, m[0], m[1], m[2]]; }
Mesh.prototype.quad = function (p0, p1, p2, p3, uv, n) {
  uv = uv || [[0, 1], [1, 1], [1, 0], [0, 0]];
  var a = vx(p0, uv[0][0], uv[0][1], n), b = vx(p1, uv[1][0], uv[1][1], n), c = vx(p2, uv[2][0], uv[2][1], n), d = vx(p3, uv[3][0], uv[3][1], n);
  this.tri(a, b, c); this.tri(a, c, d);
};
Mesh.prototype.box = function (cx, cy, cz, sx, sy, sz) {
  var x0 = cx - sx / 2, x1 = cx + sx / 2, y0 = cy - sy / 2, y1 = cy + sy / 2, z0 = cz - sz / 2, z1 = cz + sz / 2;
  this.quad([x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], null, [0, 0, -1]);
  this.quad([x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1], null, [0, 1, 0]);
  this.quad([x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0], null, [1, 0, 0]);
  this.quad([x0, y0, z1], [x0, y0, z0], [x0, y1, z0], [x0, y1, z1], null, [-1, 0, 0]);
};
Mesh.prototype.build = function () {
  this.buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.v), gl.STATIC_DRAW); this.n = this.v.length / 8; return this;
};
Mesh.prototype.update = function () {
  if (!this.buf) this.buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, this.buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.v), gl.DYNAMIC_DRAW); this.n = this.v.length / 8;
};
function texture(src, opts) {
  opts = opts || {};
  var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  var pot = function (x) { return (x & (x - 1)) === 0; };
  if (opts.mip && pot(src.width) && pot(src.height)) {
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    var wrap = opts.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  } else {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t;
}
function reupload(t, src) { gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src); }

// ------------------------------------------------------------------ 7-segment LEDs
var SEG = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg',
            '9': 'abcdfg', 'C': 'afed', 'r': 'eg', '-': 'g', ' ': '' };
function seg7(c, text, x, y, w, h, on, off) {
  var n = text.length, cw = w / n, t = Math.max(2, cw * 0.105), sk = cw * 0.08;
  for (var i = 0; i < n; i++) {
    var ox = x + i * cw + cw * 0.16, gw = cw * 0.62, hm = h / 2, lit = SEG[text[i]] || '';
    var P = function (px, py) { return [ox + px + sk * (1 - py / h), y + py]; };
    var S = { a: [[t, 0], [gw - t, 0], [gw - t * 1.5, t], [t * 1.5, t]], d: [[t * 1.5, h - t], [gw - t * 1.5, h - t], [gw - t, h], [t, h]],
              g: [[t, hm], [t * 1.5, hm - t / 2], [gw - t * 1.5, hm - t / 2], [gw - t, hm], [gw - t * 1.5, hm + t / 2], [t * 1.5, hm + t / 2]],
              f: [[0, t], [t, t * 1.5], [t, hm - t * 0.8], [0, hm - t * 0.3]], b: [[gw, t], [gw, hm - t * 0.3], [gw - t, hm - t * 0.8], [gw - t, t * 1.5]],
              e: [[0, hm + t * 0.3], [t, hm + t * 0.8], [t, h - t * 1.5], [0, h - t]], c: [[gw, hm + t * 0.3], [gw, h - t], [gw - t, h - t * 1.5], [gw - t, hm + t * 0.8]] };
    for (var k in S) {
      c.beginPath();
      S[k].forEach(function (p, j) { var q = P(p[0], p[1]); if (j) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]); });
      c.closePath(); c.fillStyle = lit.indexOf(k) >= 0 ? on : off; c.fill();
    }
  }
}

// ------------------------------------------------------------------ the scene
var M = {}, T = {}, consoleCv, bonusCv, conCtx, bonCtx, ticketMesh;
var conText = '', bonText = '', btnState = '';
function buildScene() {
  T.field = texture(IMG.field, { mip: true });
  T.front = texture(IMG.front); T.deck = texture(IMG.deck); T.tower = texture(IMG.tower);
  var white = document.createElement('canvas'); white.width = white.height = 2;
  var wc = white.getContext('2d'); wc.fillStyle = '#fff'; wc.fillRect(0, 0, 2, 2); T.white = texture(white);
  // carpet: dark with faint neon confetti
  var cp = document.createElement('canvas'); cp.width = cp.height = 256; var cc = cp.getContext('2d');
  cc.fillStyle = '#17121f'; cc.fillRect(0, 0, 256, 256);
  var r = WW.rng(11);
  for (var i = 0; i < 2600; i++) { var g = 20 + r() * 26; cc.fillStyle = 'rgba(' + (g + 6) + ',' + g + ',' + (g + 14) + ',0.8)'; cc.fillRect(r() * 256, r() * 256, 2, 2); }
  var cols = ['#4a1d48', '#1d3a52', '#3d3a12', '#3a1a28'];
  for (i = 0; i < 70; i++) { cc.fillStyle = cols[i % 4]; cc.save(); cc.translate(r() * 256, r() * 256); cc.rotate(r() * 6); cc.fillRect(-6, -1.5, 12, 3); cc.restore(); }
  T.carpet = texture(cp, { mip: true, repeat: true });
  // the ticket: a green strip tile with a perforation at each end
  var tk = document.createElement('canvas'); tk.width = 64; tk.height = 72; var tc = tk.getContext('2d');
  tc.fillStyle = '#5fcf6a'; tc.fillRect(0, 0, 64, 72);
  tc.fillStyle = '#4ab456'; tc.fillRect(0, 0, 64, 3); tc.fillRect(0, 69, 64, 3);
  tc.fillStyle = '#2e7a38'; for (i = 2; i < 64; i += 5) tc.fillRect(i, 0, 2, 2);

function lampLevels(t) {

  var lv = new Float32Array(CFG.lamps), N = CFG.lamps, i;

// ------------------------------------------------------------------ frame
var lastFrame = 0, crPhase = 0;
function frame() {
  requestAnimationFrame(frame);
  var t = now();
  pollPads();
  // state timing
  if (S.mode === 'stopped') {
    var cel = S.result.bonus ? CFG.celebrateBonusMs : CFG.celebrateWinMs;
    if (t - S.stopAt >= cel) startPayout(t);
  }
  if (S.mode === 'payout') {
    while (S.fedCount < S.feed.length && t - S.feedT0 >= S.feed[S.fedCount] - 280) {
      stripAnim.push(S.feedT0 + S.feed[S.fedCount] - 280); stripTickets++;
      S.fedCount++; S.owed = S.won - S.fedCount; S.total++; SFX.ticket(); ui();
    }
    if (S.fedCount >= S.won && t - S.feedT0 >= (S.feed.length ? S.feed[S.feed.length - 1] : 0) + 400) endPlay();
  }
  // chase tick sound, once per lamp
  if (S.mode === 'chase' && t >= S.t0) {
    var lp = Math.floor(WW.position(t - S.t0, S.start));
    if (lp !== S.lastLamp) { S.lastLamp = lp; SFX.tick(); }
  }
  var L = lampLevels(t);
  // console LEDs: TICKETS OWED while paying (showing "Cr" every few seconds, as in the video), credits otherwise
  var txt;

    var xz = ringXZ(sd * TOWER.th, TOWER.r), q = proj([xz[0], G.FY + TOWER.h, xz[1] - 0.04]);
    if (!q) return;
    var v = L.towers[k], R = 0.09 * q[2], col = sd > 0 ? '60,255,160' : '70,140,255';
    var g = c.createRadialGradient(q[0], q[1], 0, q[0], q[1], R);
    g.addColorStop(0, 'rgba(' + col + ',' + (0.55 * v) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
    c.fillStyle = g; c.beginPath(); c.arc(q[0], q[1], R, 0, 7); c.fill();
  });
  // the BONUS readout's red glow
  var bq = proj([0, G.FY + BOX.y, BOX.z - 0.03]);
  if (bq) { var g2 = c.createRadialGradient(bq[0], bq[1], 0, bq[0], bq[1], 0.16 * bq[2]); g2.addColorStop(0, 'rgba(255,40,20,0.22)'); g2.addColorStop(1, 'rgba(255,40,20,0)');
    c.fillStyle = g2; c.beginPath(); c.arc(bq[0], bq[1], 0.16 * bq[2], 0, 7); c.fill(); }
  // STOP button glow while it can be pressed
  if (btnState === 'lit') {
    var sq = proj([(548 / 1024 - 0.5) * 2 * G.CX, lerp(G.CON_B[0], G.CON_A[0], 111 / 288), lerp(G.CON_B[1], G.CON_A[1], 111 / 288) - 0.01]);
    if (sq) { var g3 = c.createRadialGradient(sq[0], sq[1], 0, sq[0], sq[1], 0.09 * sq[2]); g3.addColorStop(0, 'rgba(190,255,80,0.35)'); g3.addColorStop(1, 'rgba(190,255,80,0)');
      c.fillStyle = g3; c.beginPath(); c.arc(sq[0], sq[1], 0.09 * sq[2], 0, 7); c.fill(); }
  }
  // the dome's highlights: a bright streak and a rim
  c.globalCompositeOperation = 'lighter';
  var rim = []; for (i = 0; i <= 64; i++) { var a = i / 64 * Math.PI * 2; rim.push(proj([Math.sin(a) * G.DOME_R, G.DOME_Y + 0.004, G.C[2] + Math.cos(a) * G.DOME_R])); }
  c.strokeStyle = 'rgba(220,230,255,0.10)'; c.lineWidth = 2 * cam.dpr; c.beginPath();
  rim.forEach(function (q, j) { if (!q) return; if (j) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]); }); c.stroke();
  var arc = []; for (i = 0; i <= 24; i++) { var e = (20 + i * 2.2) * DEG, az = (-35 + i * 1.2) * DEG;
    arc.push(proj([Math.sin(az) * Math.cos(e) * G.DOME_R, G.DOME_Y + Math.sin(e) * G.DOME_R, G.C[2] + Math.cos(az) * Math.cos(e) * G.DOME_R])); }
  c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 9 * cam.dpr; c.lineCap = 'round'; c.beginPath();
  arc.forEach(function (q, j) { if (!q) return; if (j) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]); }); c.stroke();
  c.globalCompositeOperation = 'source-over';
}
function lerp(a, b, f) { return a + (b - a) * f; }
function neonTube(c, tb, lvl) {
  var pts = [], sc = 0;
  for (var i = 0; i < tb.pts.length; i++) { var p = proj(tb.pts[i]); if (!p) return; pts.push(p); sc += p[2]; }
  sc /= pts.length;
  var w = tb.w * sc, col = tb.col;

  c.lineCap = 'round'; c.lineJoin = 'round';

  c.globalCompositeOperation = 'source-over';
  path(); c.strokeStyle = 'rgba(' + col.map(function (v) { return Math.round(v * 0.35 + 60); }).join(',') + ',0.35)'; c.lineWidth = w; c.stroke();
  c.globalCompositeOperation = 'lighter';

  path(); c.strokeStyle = 'rgba(' + rgb + ',' + (0.10 * lvl) + ')'; c.lineWidth = w * 7; c.stroke();
  path(); c.strokeStyle = 'rgba(' + rgb + ',' + (0.25 * lvl) + ')'; c.lineWidth = w * 3; c.stroke();
  path(); c.strokeStyle = 'rgba(' + col.map(function (v) { return Math.round(v * 0.5 + 128); }).join(',') + ',' + (0.95 * lvl) + ')'; c.lineWidth = w * 0.9; c.stroke();
}

});
