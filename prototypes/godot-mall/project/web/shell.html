<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}
#status { background: #efe6d3 radial-gradient(circle at 50% 35%, #fbf6ea 0%, #efe6d3 55%, #e2d4b8 100%); color: #3a2a1f; font-family: Georgia, 'Times New Roman', serif; }
#load-card { position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-58%); text-align: center; }
#load-title { font-size: clamp(30px, 7vw, 54px); letter-spacing: 0.02em; margin: 0; color: #5b2a3a; }
#load-sub { font: 16px/1.4 -apple-system, system-ui, sans-serif; color: #6d5a48; margin: 10px 0 26px; }
#load-track { width: min(420px, 80vw); height: 10px; margin: 0 auto; border-radius: 6px; background: #d8c9ac; overflow: hidden; }
#load-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #a98a62, #5b2a3a); border-radius: 6px; transition: width 0.25s; }
#load-mb { font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #6d5a48; margin-top: 10px; min-height: 20px; }
#load-tip { font: 14px/1.5 -apple-system, system-ui, sans-serif; color: #8a7560; margin-top: 28px; }

#status-progress { display: none !important; }
/* VR headsets (scripts/vr.gd, design/godot-vr.md): shown only where the browser can do immersive VR */
#vr-enter { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 900; display: none;
	font: 600 22px/1 -apple-system, system-ui, sans-serif; color: #fbf6ea; background: #5b2a3a; border: 2px solid #efe6d3;
	border-radius: 14px; padding: 18px 34px; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
#vr-enter.big { bottom: 50%; transform: translate(-50%, 50%); font-size: 30px; padding: 26px 48px; }
#vr-note { position: fixed; left: 0; right: 0; bottom: 96px; z-index: 900; display: none; text-align: center;
	font: 15px/1.4 -apple-system, system-ui, sans-serif; color: #fbf6ea; text-shadow: 0 1px 3px #000; pointer-events: none; }
/* crossing between the wings: a dark screen instead of the cream card (scripts/player.gd) */
body.xfer #status { background: #000; color: #e9dfcb; }
body.xfer #load-title { font-size: clamp(22px, 4.5vw, 34px); color: #efe6d3; }
body.xfer #load-sub { color: #b8a88f; margin-bottom: 18px; }
body.xfer #load-track { background: #2a2420; height: 4px; width: min(260px, 60vw); }
body.xfer #load-bar { background: #e9dfcb; }
body.xfer #load-mb, body.xfer #load-tip { color: #8c7d68; }
body.xfer #load-tip { display: none; }

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

// Owner-editable signs (scripts/signs.gd): publishing the owner's sign edits to
// play/signs.json on GitHub, the same way the main game's editor Publish writes files
// (contents API, the token it keeps in this browser under "southland-gh"). Nothing secret
// lives here: without a saved token it asks for one and does not keep it.
// The playable arcade cabinets (scripts/signs.gd, play/emu.html): a full-window frame over the
// game; emu.html posts "emu-close" to come back to the mall.
window.mallRoms = {
	frame: null,
	open: function (url) {
		if (this.frame) return;
		var f = document.createElement('iframe');
		f.src = url;
		f.allow = 'autoplay; fullscreen; gamepad';
		f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1000;background:#000';
		document.body.appendChild(f);
		this.frame = f;
		if (window.mallVR) window.mallVR.show();
	},
	close: function () {
		if (!this.frame) return;
		this.frame.remove();
		this.frame = null;
		if (window.mallVR) window.mallVR.show();
		var c = document.getElementById('canvas');
		if (c) c.focus();
	},
	isOpen: function () { return this.frame ? '1' : '0'; }
};
window.addEventListener('message', function (e) { if (e.data === 'emu-close') window.mallRoms.close(); });
// VR headsets (scripts/vr.gd, design/godot-vr.md). The game calls offer() when the browser can do
// immersive VR and has set window.mallVREnter; the button's press starts the session. Crossing to
// the other wing loads a new page, which ends the session: 'mall-vr' in sessionStorage remembers
// it, the new page makes the button big, and where the browser hands the session over
// ("sessiongranted", Meta Quest Browser) VR resumes without a press.
// Tuning from the URL: ?vrscale=0.8 draws fewer pixels per eye, ?vrfov=0..1 sets how much the
// edges of the view are drawn coarser (fixed foveation, default 1 = most).
window.mallVR = {
	offered: false, inSession: false, granted: false, session: null, state: 'none',
	q: function (k) { try { return new URLSearchParams(location.search).get(k); } catch (e) { return null; } },
	was: function () { try { return sessionStorage.getItem('mall-vr') === '1'; } catch (e) { return false; } },
	remember: function (on) { try { if (on) sessionStorage.setItem('mall-vr', '1'); else sessionStorage.removeItem('mall-vr'); } catch (e) {} },
	note: function (t) { var n = document.getElementById('vr-note'); n.textContent = t || ''; n.style.display = t ? 'block' : 'none'; },
	show: function () {
		var b = document.getElementById('vr-enter');
		b.style.display = (this.offered && !this.inSession && !window.mallRoms.frame) ? 'block' : 'none';
		b.classList.toggle('big', this.was());
		b.textContent = this.was() ? 'Back into VR' : 'Enter VR';
	},
	offer: function () {
		this.offered = true; this.state = 'offered';

	},
	enter: function () { this.note(''); if (window.mallVREnter && !this.inSession) window.mallVREnter(); },
	started: function () { this.inSession = true; this.state = 'in'; this.remember(false); this.show(); },
	ended: function () { this.inSession = false; this.state = 'out'; this.session = null; this.show(); },
	failed: function (msg) { this.state = 'failed'; this.note('VR did not start: ' + msg); this.show(); },

(function () {
	var V = window.mallVR;

}());

	status: '',
	path: path,
	key: key,
	what: what,
	repo: function (cfg) {

			live[K] = live[K] || {};

				var v = draft[k];

				if (v && typeof v === 'object' && !Array.isArray(v)) live[K][k] = Object.assign({}, live[K][k] || {}, v);

		}).then(function (r) {

			if (r.status === 403 || r.status === 404) throw 'this token cannot write to ' + repo;
			if (r.status === 409) throw 'someone else changed the ' + S.what + '; reload and publish again';
			throw 'GitHub said ' + r.status;

	}
}; }
window.mallSigns = mallPublisher('prototypes/godot-mall/play/signs.json', 'signs', 'mall signs');
// Pocket Change's prize words (scripts/prizes.gd): play/prize_text.json {"text": {id: {text, font, size, fill, outline}}}

const GODOT_CONFIG = $GODOT_CONFIG;

// computer GPUs) and "mobile" (ETC2 and ASTC: phones, tablets, VR headsets). Each device
// downloads only its own. tools/export_web.sh fills in the sizes. Override with ?pack=.
// The mall ships as two wings (design/godot-wings.md), each its own pair of files:
// w1.desktop.pck / w1.mobile.pck (Sears and the east halls, with Gumballs) and w2.* (the
// Dillard's court, the Concourse, JCPenney). ?wing=1|2 picks the wing; the game sets it when you
// cross the seam. While you walk one wing, the other wing's file is fetched into this browser's
// cache (Cache Storage), so crossing over does not download it again.
const PACK_SIZES = {"w1": {"desktop": 0, "mobile": 0}, "w2": {"desktop": 0, "mobile": 0}}; // PACK_SIZES
function mallPackKind() {
	try { const q = new URLSearchParams(location.search).get('pack'); if (q === 'desktop' || q === 'mobile') { return q; } } catch (e) { /* ignore */ }
	try { const s = localStorage.getItem('southland-pack'); if (s === 'desktop' || s === 'mobile') { return s; } } catch (e) { /* ignore */ }
	try {
		const gl = document.createElement('canvas').getContext('webgl2');
		if (gl) {
			const has = (n) => !!gl.getExtension(n);
			const desk = has('WEBGL_compressed_texture_s3tc') && has('EXT_texture_compression_bptc');
			const mob = has('WEBGL_compressed_texture_etc') && has('WEBGL_compressed_texture_astc');
			const lose = gl.getExtension('WEBGL_lose_context');
			if (lose) { lose.loseContext(); }
			if (desk) { return 'desktop'; }
			if (mob) { return 'mobile'; }

window.__mallWing = (function () {
	try { const w = new URLSearchParams(location.search).get('wing'); if (w === '2') { return 2; } } catch (e) { /* ignore */ }
	return 1;
}());

	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {

		}
		if (mode === 'hidden') {

	}

		while (statusNotice.lastChild) {

		}

					statusProgress.max = total;
					lbar.style.width = (100 * current / total).toFixed(1) + '%';
					lmb.textContent = (current / 1048576).toFixed(0) + ' of ' + (total / 1048576).toFixed(0) + ' MB' + (current >= total ? ' · setting up the lights…' : '');

			setTimeout(window.mallPrefetchOther, 6000);
		}, displayFailureNotice);
	}
}());
