# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.1.2
  last_upgraded: 2026-09-25

project:
  name: "Southland Mall '95"

# No engine block on purpose: Southland is a hand-built browser game (vanilla
# JavaScript + canvas raycaster in index.html, hosted on GitHub Pages). Do not
# run /setup-engine unless the project is ported to an engine.

# Only rigor and automation live here. The six knobs rigor fronts
# (review_mode, workflow, docs.density, qa.level, story_granularity, team.size)
# must stay absent so rigor keeps controlling them.
modes:
  rigor: minimal
  automation: collaborative

# Per-system tiers are added after /reverse-document names the systems.
# Planned: the photo pipeline (uploads, moderation, Publish, tokens) and the
# renderer get a stricter tier than the rest, e.g.
#   workflow_overrides:
#     system_overrides:
#       photo-pipeline: full
#       renderer: standard
# This block belongs at the document root, never under `modes:`.
